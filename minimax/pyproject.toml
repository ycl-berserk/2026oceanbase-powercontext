[project]
name = "sdd-context"
version = "0.1.0"
description = "SDD 工程上下文模块：seekdb 检索规格/代码/测试，PowerContext 保存任务状态"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pylibseekdb>=1.4.0",
  "pymysql>=1.1.0",
  "httpx>=0.27.0",
  "powercontext[builtin,cli,ops]>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sddctx = "sdd_context.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
